name: Release (CI-gated, pull-based CD)

# Runs only after the CI workflow succeeded on main. It publishes immutable, SHA-tagged images to GHCR and,
# as the LAST step, moves the :release tag. The production server polls :release and deploys it itself
# (migrate -> swap -> health check -> automatic rollback). No cloud credentials are stored in GitHub.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish images and promote to :release
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04-arm
    env:
      REGISTRY: ghcr.io
      OWNER: ${{ github.repository_owner }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.SHA }}" }
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push SHA-tagged images
        run: |
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          docker build -t $REGISTRY/$OWNER_LC/carve-backend:$SHA backend
          docker build -t $REGISTRY/$OWNER_LC/carve-frontend:$SHA --build-arg NEXT_PUBLIC_API_URL=/api/v1 frontend
          docker push $REGISTRY/$OWNER_LC/carve-backend:$SHA
          docker push $REGISTRY/$OWNER_LC/carve-frontend:$SHA
      - name: Promote to :release (what the server deploys)
        run: |
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          for img in carve-backend carve-frontend; do
            docker tag $REGISTRY/$OWNER_LC/$img:$SHA $REGISTRY/$OWNER_LC/$img:release
            docker push $REGISTRY/$OWNER_LC/$img:release
          done
      - name: Summary
        run: echo "Released $SHA. The server picks it up within ~2 minutes and rolls back automatically if /health/ready fails." >> "$GITHUB_STEP_SUMMARY"
