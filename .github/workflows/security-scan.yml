name: Weekly security scan

on:
  schedule: [{ cron: "0 3 * * 1" }]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install bandit pip-audit
      - run: bandit -q -r backend/app -ll
      - # Accepted, no fixed release exists: PYSEC-2026-4298 (python-jose key confusion: not reachable, algorithms are pinned to HS256/RS256)
        # and PYSEC-2026-1325 (ecdsa Minerva timing: ECDSA signing is never used).
        run: pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2026-4298 --ignore-vuln PYSEC-2026-1325
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { scan-type: fs, scan-ref: ., severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1" }
