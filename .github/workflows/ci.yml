name: CI

on:
  push:
    branches: [main, "aws/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend – lint, tests, SAST, dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r backend/requirements-dev.txt
      - name: flake8 (errors only)
        run: flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: pytest with coverage
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=60 tests/
      - name: Bandit (fail on medium+ findings)
        run: bandit -q -r backend/app -ll
      - name: pip-audit (runtime dependencies)
        run: pip-audit -r backend/requirements.txt

  frontend:
    name: Frontend – build and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env: { NEXT_PUBLIC_API_URL: /api/v1 }
      - name: npm audit (production deps, fail on critical)
        run: npm audit --omit=dev --audit-level=critical
        working-directory: frontend

  secrets-and-iac:
    name: Secret scan, Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.7.5" }
      - name: terraform fmt + validate (lab stack)
        working-directory: terraform/lab
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  images:
    name: Build arm64 images and scan (Trivy)
    runs-on: ubuntu-24.04-arm   # the AWS host is Graviton (arm64); runner is native, no emulation
    needs: [backend, frontend, secrets-and-iac]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          docker build -t carve-backend:ci backend
          docker build -t carve-frontend:ci --build-arg NEXT_PUBLIC_API_URL=/api/v1 frontend
      - name: Trivy – fail on CRITICAL with a fix available
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: carve-backend:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy – frontend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: carve-frontend:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Containers run as non-root
        run: |
          test "$(docker run --rm --entrypoint id carve-backend:ci -u)" != 0
          test "$(docker run --rm --entrypoint id carve-frontend:ci -u)" != 0
