version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: careflow-db
    restart: always
    environment:
      POSTGRES_USER: careflow_admin
      POSTGRES_PASSWORD: careflow_dev_password_2026
      POSTGRES_DB: careflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careflow_admin -d careflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careflow-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://careflow_admin:careflow_dev_password_2026@db:5432/careflow
      SECRET_KEY: careflow-super-secure-production-ready-jwt-secret-key-change-in-prod-2026
      ENVIRONMENT: development
      ENABLE_DEMO_ENDPOINTS: "true"
      STORAGE_MODE: local
      USE_AWS_COGNITO: "false"
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    command: >
      sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_DEMO_MODE: "false"
    container_name: careflow-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  pgdata:
