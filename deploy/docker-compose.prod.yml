# Production stack on the EC2 host. Non-secret settings come from /opt/carevia/deploy.env;
# secrets are fetched by the backend from AWS Secrets Manager using the instance role.
name: carevia
x-logging: &awslogs
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION}
    awslogs-group: ${LOG_GROUP}
    tag: "{{.Name}}"

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [backend, frontend]
    logging: *awslogs

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      AWS_REGION: ${AWS_REGION}
      DB_SECRET_ID: ${DB_SECRET_ID}
      JWT_SECRET_ID: ${JWT_SECRET_ID}
      STORAGE_MODE: s3
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      SQS_NOTIFICATION_QUEUE_URL: ${SQS_URL}
      SNS_ALERT_TOPIC_ARN: ${SNS_ARN}
      BACKEND_CORS_ORIGINS: '["https://${SITE_HOST}"]'
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *awslogs

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    logging: *awslogs

volumes:
  caddy_data:
